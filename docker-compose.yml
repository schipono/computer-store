version: "3"

services:
  db:
    container_name: db
    image: "postgres:14.7"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: store
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data/pgdata
    command: postgres
  computer_store:
    container_name: computer_store
    image: "computer_store:latest"
    platform: linux/arm64
    build:
      context: ./
    depends_on:
      - db
    environment:
      ENV: production
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: store
      POSTGRES_HOST: db
    ports:
      - "8080:8080"

